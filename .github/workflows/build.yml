name: build

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: localblindness-jar
          path: build/libs/*.jar
          if-no-files-found: error

  client-game-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run client GameTests
        run: xvfb-run -a ./gradlew runClientGameTest --stacktrace

      - name: Upload client GameTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blindfold-client-gametest
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
          if-no-files-found: warn
