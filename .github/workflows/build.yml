name: build

on:
  push:
    branches: [ release, main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, crucible-pc]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: blindfold-jar
          path: build/libs/*.jar
          if-no-files-found: error

  client-game-test:
    runs-on: [self-hosted, crucible-pc]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The self-hosted runner container starts bare; give the headless MC client a
      # virtual display and software GL. No-op when already installed.
      - name: Ensure xvfb and GL libraries
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              xvfb libgl1 libglx-mesa0 libgl1-mesa-dri \
              libxrandr2 libxcursor1 libxi6 libxxf86vm1 libxinerama1
          fi

      - name: Run client GameTests
        run: xvfb-run -a ./gradlew runClientGameTest --stacktrace

      - name: Upload client GameTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blindfold-client-gametest
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
          if-no-files-found: warn
