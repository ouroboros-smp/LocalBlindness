name: publish

# Publishes on every version tag (e.g. `git tag v1.1.2 && git push origin v1.1.2`).
# Can also be run by hand from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the jar to the GitHub release for the tag

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Publish to Modrinth / CurseForge / GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # The built mod jar. Only one jar is produced (no sources jar).
          files: build/libs/*.jar

          # ---- Modrinth ----
          # modrinth-id is the project slug or id. Create the project first (slug: local-blindness),
          # then add a MODRINTH_TOKEN repo secret (Modrinth > Settings > PATs, scope: create versions).
          modrinth-id: local-blindness
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # ---- CurseForge (optional) ----
          # Skipped automatically if CURSEFORGE_TOKEN is not set. curseforge-id is the numeric project id.
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # ---- GitHub release ----
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # ---- metadata ----
          # Version, loader, and game versions are read from fabric.mod.json; kept explicit here for safety.
          name: Local Blindness ${{ github.ref_name }}
          version-type: release
          loaders: fabric
          game-versions: '1.21.11'
          java: '21'
          dependencies: |
            fabric-api(required)
