name: publish

# Publishes on every version tag (e.g. `git tag v1.3.0 && git push origin v1.3.0`).
# Can also be run by hand from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the jar to the GitHub release for the tag

jobs:
  publish:
    runs-on: onyx-ephemeral
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          release_version=${GITHUB_REF_NAME#v}
          declared_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [[ "$release_version" != "$declared_version" ]]; then
            echo "::error::Tag version $release_version does not match mod_version $declared_version"
            exit 1
          fi

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Publish to Modrinth / CurseForge / GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # The built mod jar. Only one jar is produced (no sources jar).
          files: build/libs/*.jar

          # ---- Modrinth ----
          # Project slug is "blindfold". Add a MODRINTH_TOKEN repo secret
          # (Modrinth > Settings > PATs, scope: create versions).
          modrinth-id: blindfold
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # ---- CurseForge (optional) ----
          # Skipped automatically if CURSEFORGE_TOKEN is not set. curseforge-id is the numeric project id.
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # ---- GitHub release ----
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # ---- metadata ----
          # Version, loader, and game versions are read from fabric.mod.json; kept explicit here for safety.
          name: Blindfold ${{ github.ref_name }}
          version-type: release
          loaders: fabric
          game-versions: '1.21.11'
          java: '21'
          dependencies: |
            fabric-api(required)
